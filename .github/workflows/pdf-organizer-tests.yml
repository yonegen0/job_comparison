name: PDF organizer tests
on:
  pull_request:
    paths:
      - 'job_pdf_tool/**'
      - 'job_comparison_app/gui/**'
      - 'tests/test_circus_pdf.py'
      - 'tests/test_gui_view_app.py'
      - 'tests/test_json_only_modes.py'
      - 'tests/test_user_guide.py'
      - 'tools/user_guide_capture/**'
      - 'docs/user-guide/**'
      - '.github/workflows/pdf-organizer-tests.yml'
  push:
    branches: [main]
    paths:
      - 'job_pdf_tool/**'
      - 'job_comparison_app/gui/**'
      - 'tests/test_circus_pdf.py'
      - 'tests/test_user_guide.py'
      - 'docs/user-guide/**'
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -r requirements.txt
      - run: python -m pytest -q tests/test_circus_pdf.py tests/test_extractor.py tests/test_naming.py tests/test_json_output.py tests/test_output_transaction.py tests/test_services_gui.py tests/test_user_guide.py
  gui-pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -r requirements.txt
      - run: python -m pytest -q tests/test_gui_view_app.py tests/test_json_only_modes.py
      # PR #5 one-time verification; revert this workflow edit after results.
      - run: python -m pytest tests/test_gui_visuals.py tests/test_user_guide.py -q
      - run: python -m pytest -q
